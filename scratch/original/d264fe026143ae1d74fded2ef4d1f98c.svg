"46.150000000000006px">Mandalorian helmet from Disney's series. (vector made by me)</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">The rest is made by @KIKOKO_</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Beta testers: @TimMcCool @XShrunk @iDuoof @Carot3 @I8D @INorth</tspan><tspan x="0" dy="46.150000000000006px">@missyq @spazestudios</tspan></text></g></g></svg>