.76627,-2.38393v-6.64097h-2.12851v-1.61767h2.12851v-3.06506z" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt"/><text transform="translate(28.5,69.4473) scale(0.29624,0.29624)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">How this game works:</tspan><tspan x="0" dy="46.150000000000006px">You can choose your weapon loadout in "Gear"</tspan><tspan x="0" dy="46.150000000000006px">Every item costs loadout points, if you have items worth more </tspan><tspan x="0" dy="46.150000000000006px">than the max point, you cant have that loadout.</tspan><tspan x="0" dy="46.150000000000006px">(this is disabled in the "Gun game")</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">You can always drop in and out of the online game. </tspan><tspan x="0" dy="46.150000000000006px">1 round lasts 9:30 minutes, and after that there is voting for the </tspan><tspan x="0" dy="46.150000000000006px">next gamemode. </tspan><tspan x="0" dy="46.150000000000006px">There are 4 gamemodes:</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Team death match - 4 teams fight.</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Gun game - All vs all. When you kill someone you get a </tspan><tspan x="0" dy="46.150000000000006px">random gun. Gear points disabled.</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Capture the flag - 2 teams steal eachothers flag, and bring it</tspan><tspan x="0" dy="46.150000000000006px">back to their own flag.</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Free for all - normal all vs all like my other shooters</tspan></text></g></g></svg>