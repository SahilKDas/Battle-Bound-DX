<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="429.19092" height="315.06595" viewBox="0,0,429.19092,315.06595"><defs><radialGradient cx="240.00002" cy="54" r="194.5" gradientUnits="userSpaceOnUse" id="color-1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient></defs><g transform="translate(-37.72417,-21.9888)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><text transform="translate(186.12584,41.3376) scale(0.4448,0.4448)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Gamemodes</tspan></text><path d="M434.50002,54h-389" fill="none" stroke="url(#color-1)" stroke-width="2" stroke-linecap="round"/><text transform="translate(38.08975,76.63993) scale(0.24372,0.24372)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">This game features 4 gamemodes, with more potentially being added!</tspan><tspan x="0" dy="48px">There is cloud voting with everyone playing after every round to</tspan><tspan x="0" dy="48px">decide the next gamemode!</tspan><tspan x="0" dy="48px">1 round lasts 9.30 minutes and voting lasts 30 seconds.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">There is a 7 second respawn timer when you die* (It wont reset if you rejoin by the way)</tspan><tspan x="0" dy="48px">You can drop in and out mid-game to change gear or whatever.</tspan><tspan x="0" dy="48px">(Joining mid-game in Capture the flag will result in unsure capture count).</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Team death match:</tspan><tspan x="0" dy="48px">4 teams (Orange &amp; Green &amp; Blue &amp; Purple)  fight eachother. You can't hurt your teammates, </tspan><tspan x="0" dy="48px">you can see everyone on the minimap.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Gun game:</tspan><tspan x="0" dy="48px">No intentional teams, so you can damage anyone. Every time you kill someone you get a </tspan><tspan x="0" dy="48px">random primary gun. There is also no gear point limit. You can see everyone on the map.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Capture the flag:</tspan><tspan x="0" dy="48px">2 teams (Orange &amp; blue) is supposed to steal eachothers flag! You need to steal the enemy</tspan><tspan x="0" dy="48px">flag and return it to your own flag post to get a point. You cannot hurt your teammates.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Free for all</tspan><tspan x="0" dy="48px">You can damage anyone and see everyone on the minimap.</tspan></text></g></g></svg>