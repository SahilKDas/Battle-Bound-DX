<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="422.77804" height="116.19043" viewBox="0,0,422.77804,116.19043"><defs><radialGradient cx="240.00002" cy="54" r="194.5" gradientUnits="userSpaceOnUse" id="color-1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient></defs><g transform="translate(-37.72417,-21.9888)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><path d="M434.50002,54h-389" fill="none" stroke="url(#color-1)" stroke-width="2" stroke-linecap="round"/><text transform="translate(38.08975,76.63993) scale(0.24372,0.24372)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Teams are defined by the color of the stickmen.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Keep in mind that the brightness adjustment is visible on team-modes, so every teammate</tspan><tspan x="0" dy="48px">may not look identical because of uneven brightnesses on other players.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">You can not damage your teammates in the teammode gamemodes.</tspan></text><text transform="translate(212.6715,41.3376) scale(0.4448,0.4448)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Teams</tspan></text></g></g></svg>