00000006px"> </tspan><tspan x="0" dy="46.150000000000006px">-Crawling reduces explosion damage</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">-Diving reduces fall damage</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">-Crawling makes you invisible on the minimap</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">-Take advantage of the custom controls, it can be easier to play with custom</tspan><tspan x="0" dy="46.150000000000006px">settings!</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">-Barbed wire doesn't hurt you when you crawl</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">-Flipping and diving increases speed</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">-Headshots do double damage</tspan></text></g></g></svg>