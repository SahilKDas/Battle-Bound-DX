<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="481.01001" height="229.96619" viewBox="0,0,481.01001,229.96619"><g transform="translate(0.505,-65.0169)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><path d="M473.47578,294.9831h-466.95155c-3.87612,0 -7.02923,-3.14307 -7.02923,-7.02923v-215.90773c0,-3.87612 3.14307,-7.02923 7.02923,-7.02923h466.95155c3.87612,0 7.02923,3.14307 7.02923,7.02923v215.90773c-0.01004,3.88616 -3.15311,7.02923 -7.02923,7.02923z" fill="#000000" stroke="#000000" stroke-width="0" opacity="0.25"/><text transform="translate(7.92417,81.85332) scale(0.27341,0.27341)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Gamemode information</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Team death match:</tspan><tspan x="0" dy="48px">2 teams (Orange &amp; Blue) fight eachother. You can't hurt your teammates, and you</tspan><tspan x="0" dy="48px">can't see the enemy team on the map.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Gun game:</tspan><tspan x="0" dy="48px">No intentional teams so you can damage anyone. Every time you kill someone you get a </tspan><tspan x="0" dy="48px">random primary gun. There is also no gear point limit. You can see everyone on the map.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Capture the flag:</tspan><tspan x="0" dy="48px">2 teams (Orange &amp; blue) is supposed to steal eachothers flag! The flag is nearby their</tspan><tspan x="0" dy="48px">spawn. You cannot hurt your teammates or see the enemy team on the minimap.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Free for all</tspan><tspan x="0" dy="48px">You can damage anyone and see everyone on the minimap.</tspan></text></g></g></svg>