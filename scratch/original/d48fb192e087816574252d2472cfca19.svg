<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="408.92408" height="279.97027" viewBox="0,0,408.92408,279.97027"><defs><radialGradient cx="240.00003" cy="54" r="194.5" gradientUnits="userSpaceOnUse" id="color-1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient></defs><g transform="translate(-37.72417,-21.9888)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><text transform="translate(184.71138,41.3376) scale(0.4448,0.4448)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Performance</tspan></text><path d="M434.50003,54h-389" fill="none" stroke="url(#color-1)" stroke-width="2" stroke-linecap="round"/><text transform="translate(38.08975,76.63993) scale(0.24372,0.24372)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">There are 2 types of lag in this game. </tspan><tspan x="0" dy="48px">1 is low framerate and 2 is slow cloud update.</tspan><tspan x="0" dy="48px">Here are some tips that might help you to improve both things.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">How to improve framerate:</tspan><tspan x="0" dy="48px">If you are playing on a laptop; charging the computer might help a little bit.</tspan><tspan x="0" dy="48px">You can also try to minimize other applications running. For an example,</tspan><tspan x="0" dy="48px">if you have 100 tabs in your browser, it could help the performance to </tspan><tspan x="0" dy="48px">close some of them.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">How to improve cloud update:</tspan><tspan x="0" dy="48px">This is almost purely based on internet connection.</tspan><tspan x="0" dy="48px">If you internet is slow, the game will lag too.</tspan><tspan x="0" dy="48px">You can try to sit closer to the wifi router for a stronger signal.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">The game will probably lag anyways if there are many people playing at the same time. </tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Keep in mind that you might still experience lag even if you've followed</tspan><tspan x="0" dy="48px">these tips*</tspan></text></g></g></svg>