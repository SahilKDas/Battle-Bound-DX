<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="432.15745" height="256.57315" viewBox="0,0,432.15745,256.57315"><defs><radialGradient cx="240.00003" cy="54" r="194.5" gradientUnits="userSpaceOnUse" id="color-1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient></defs><g transform="translate(-37.72417,-21.9888)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><text transform="translate(202.86813,41.3376) scale(0.4448,0.4448)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Game UI</tspan></text><path d="M434.50003,54h-389" fill="none" stroke="url(#color-1)" stroke-width="2" stroke-linecap="round"/><text transform="translate(38.08975,76.63993) scale(0.24372,0.24372)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">The player count is displayed top left in the game, and kill count is displayed top right.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">When you view the map, you can view the leaderboard list if you are</tspan><tspan x="0" dy="48px">not playing capture the flag. Do this by hovering your mousepointer nearby the</tspan><tspan x="0" dy="48px">text that says Leaderboard.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">You can see everyone on the map when you are not playing capture the flag.</tspan><tspan x="0" dy="48px">If you are playing capture the flag, you can only see your teammates on the map.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">When you play capture the flag, you'll see colored numbers under your kill-count.</tspan><tspan x="0" dy="48px">This is the team's flag captures. Note that if you join mind game with capture the flag mode, </tspan><tspan x="0" dy="48px">the project can not count the captures right. (that is why the leave button is disabled in</tspan><tspan x="0" dy="48px">capture the flag).</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">If you have map open, the colored numbers will turn into players playing on each team. </tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Most of the UI is self explanatory, except for what you just read.</tspan></text></g></g></svg>