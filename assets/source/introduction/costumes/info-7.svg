<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="397.77586" height="221.47747" viewBox="0,0,397.77586,221.47747"><defs><radialGradient cx="240.00003" cy="54" r="194.5" gradientUnits="userSpaceOnUse" id="color-1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient></defs><g transform="translate(-37.72417,-21.9888)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><text transform="translate(191.38341,41.3376) scale(0.4448,0.4448)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Multiplayer</tspan></text><path d="M434.50003,54h-389" fill="none" stroke="url(#color-1)" stroke-width="2" stroke-linecap="round"/><text transform="translate(38.08975,76.63993) scale(0.24372,0.24372)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Scratch limits the use of cloud variables to accounts with "Scratcher"</tspan><tspan x="0" dy="48px">status. If it says "New Scratcher" under your username on your profile,</tspan><tspan x="0" dy="48px">you cannot use cloud variables on Scratch.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">You can still play on Turbowarp since it uses another cloud server.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Turbowarp is NOT linked to any scratch accounts, so usernames there are </tspan><tspan x="0" dy="48px">customized. </tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Custom usernames seem scary, but Turbowarp has a very strict detector</tspan><tspan x="0" dy="48px">that works very well for safety hazards and bad words. </tspan><tspan x="0" dy="48px">That does not mean you should try to fool it though!</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">**Players teleporting, freezing, not taking damage and overall lagging is because of </tspan><tspan x="0" dy="48px">cloud delay**</tspan></text></g></g></svg>