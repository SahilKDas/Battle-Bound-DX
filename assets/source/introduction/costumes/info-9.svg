<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="431.69667" height="197.58035" viewBox="0,0,431.69667,197.58035"><defs><radialGradient cx="240.00002" cy="54" r="194.5" gradientUnits="userSpaceOnUse" id="color-1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient></defs><g transform="translate(-37.72417,-21.9888)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><text transform="translate(199.65666,41.3376) scale(0.4448,0.4448)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Feedback</tspan></text><path d="M434.50002,54h-389" fill="none" stroke="url(#color-1)" stroke-width="2" stroke-linecap="round"/><text transform="translate(38.08975,76.13993) scale(0.24372,0.24372)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Please let me know if you experience anything weird or want some changes in the game.</tspan><tspan x="0" dy="48px">Now in the start, the guns and items might not be that well-balanced, so please let me know</tspan><tspan x="0" dy="48px">what you think of the gearpoints and how good the weapon is.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Feedback is appreciated!</tspan><tspan x="0" dy="48px">Also, there is a much bigger chance I will see your comment if you comment on my profile :)</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Updates </tspan><tspan x="0" dy="48px">I will try to update this game more than I have with my other games, for an example adding </tspan><tspan x="0" dy="48px">another map or extra guns. Although I don not want to promise anything</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">You can go to the bottom of the description to see the change log.</tspan></text></g></g></svg>