<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="434.16433" height="186.38179" viewBox="0,0,434.16433,186.38179"><defs><radialGradient cx="240.00002" cy="54" r="194.5" gradientUnits="userSpaceOnUse" id="color-1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient></defs><g transform="translate(-36.99301,-21.9888)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><text transform="translate(219.55701,41.3376) scale(0.4448,0.4448)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Gear</tspan></text><path d="M45.50003,54h389" fill="none" stroke="url(#color-1)" stroke-width="2" stroke-linecap="round"/><text transform="translate(38.08975,76.63993) scale(0.24372,0.24372)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Under "gear", you can customize your loadout and your look.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Just click around to select weapons. The loadout is divided up in "Primary"</tspan><tspan x="0" dy="48px">"Secondary"  and "Gadget". That means you always have 3 different items.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">All items have loadout points, so you cannot combine the best of the </tspan><tspan x="0" dy="48px">best always. If the number is green, you can afford it, if it is yellow, you cannot. If you try to </tspan><tspan x="0" dy="48px">cheat it your secondary and gadget items will reset in the game. However, this loadout point </tspan><tspan x="0" dy="48px">limit is disabled in the gamemode "Gun game".</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">In the "look" section, you can adjust your stickman color &amp; brightness as well as </tspan><tspan x="0" dy="48px">choosing a hat to have on.</tspan></text></g></g></svg>