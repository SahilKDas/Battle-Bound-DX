<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="599.54688" height="124" viewBox="0,0,599.54688,124"><g transform="translate(0.86996,-175.94375)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" font-size="40" text-anchor="start" style="mix-blend-mode: normal"><text transform="translate(-0.11996,197.69375) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">All items cost loadout points, so you can't always pick the </tspan><tspan x="0" dy="48px">best of the best. If you have a too expensive loadout, your </tspan><tspan x="0" dy="48px">secondary and gadget items will reset in-game. </tspan><tspan x="0" dy="48px">However, this loadout point limit is disabled in the gamemode </tspan><tspan x="0" dy="48px">"Gun game".</tspan></text></g></g></svg>